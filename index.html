<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#08090d">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <!-- Archivo externo de Staff -->
  <script src="./staff.js?v=1.1.19"></script>

  <style>
    :root {
      --bg-main: #08090d;
      --surface-1: rgba(12, 14, 20, 0.68);
      --surface-2: rgba(28, 32, 45, 0.75);
      --border-subtle: rgba(255, 255, 255, 0.12);
      --border-focus: rgba(176, 38, 255, 0.5);
      --neon-purple: #b026ff;
      --purple-glow: rgba(176, 38, 255, 0.6);
      --neon-green: #00ff66;
      --green-glow: rgba(0, 255, 102, 0.5);
      --telegram-blue: #229ed9;
      --telegram-glow: rgba(34, 158, 217, 0.6);
      --tiktok-glow: rgba(255, 255, 255, 0.7);
      --text-primary: #ffffff;
      --text-secondary: #c5cad8;
      --text-muted: #8b92a5;
      --app-height: 100dvh;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100%;
      height: var(--app-height);
      max-height: var(--app-height);
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      position: fixed;
      inset: 0;
    }

    body {
      background-image: 
        radial-gradient(circle at 15% 0%, rgba(176, 38, 255, 0.22) 0%, transparent 50%),
        radial-gradient(circle at 85% 100%, rgba(0, 255, 102, 0.15) 0%, transparent 45%);
      display: flex;
      flex-direction: column;
    }

    .header-bar {
      height: 52px;
      padding: 0 16px;
      padding-top: env(safe-area-inset-top, 0px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(8, 9, 13, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      flex-shrink: 0;
      z-index: 50;
    }

    @media (min-width: 900px) {
      .header-bar {
        height: 58px;
        padding: 0 28px;
      }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-cassette-svg {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      filter: drop-shadow(0 0 8px rgba(176, 38, 255, 0.5)) drop-shadow(0 0 10px rgba(0, 255, 102, 0.4));
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      cursor: pointer;
    }

    .brand-cassette-svg:hover {
      transform: scale(1.08) rotate(-2deg);
    }

    .brand-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 19px;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 5px;
      position: relative;
    }

    .brand-name::after {
      content: '';
      position: absolute;
      top: 0;
      left: -120%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transform: skewX(-24deg);
      animation: cyberSweep 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      pointer-events: none;
    }

    .title-nexus {
      color: var(--neon-purple);
      text-shadow: 0 0 10px var(--purple-glow), 0 0 22px rgba(176, 38, 255, 0.4);
      animation: pulseNeonPurple 3.2s ease-in-out infinite alternate;
    }

    .title-zone {
      color: var(--neon-green);
      text-shadow: 0 0 10px var(--green-glow), 0 0 22px rgba(0, 255, 102, 0.4);
      animation: pulseNeonGreen 3.2s ease-in-out infinite alternate;
    }

    @keyframes pulseNeonPurple {
      0% { text-shadow: 0 0 8px var(--purple-glow); }
      100% { text-shadow: 0 0 14px var(--neon-purple), 0 0 24px rgba(176, 38, 255, 0.5); }
    }

    @keyframes pulseNeonGreen {
      0% { text-shadow: 0 0 8px var(--green-glow); }
      100% { text-shadow: 0 0 14px var(--neon-green), 0 0 24px rgba(0, 255, 102, 0.5); }
    }

    @keyframes cyberSweep {
      0%, 65% { left: -120%; opacity: 0; }
      70% { opacity: 0.8; }
      80% { left: 160%; opacity: 0; }
      100% { left: 160%; opacity: 0; }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: #ffffff;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .social-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    @media (hover: hover) {
      .social-tiktok:hover {
        border-color: #ffffff;
        background: rgba(255, 255, 255, 0.18);
        color: #ffffff;
        box-shadow: 0 0 16px var(--tiktok-glow), 0 0 6px #ffffff;
        transform: translateY(-2px);
      }
      .social-tiktok:hover svg {
        transform: scale(1.1);
        filter: drop-shadow(0 0 8px #ffffff);
      }
      .social-telegram:hover {
        border-color: var(--telegram-blue);
        background: rgba(34, 158, 217, 0.2);
        color: var(--telegram-blue);
        box-shadow: 0 0 16px var(--telegram-glow), 0 0 6px var(--telegram-blue);
        transform: translateY(-2px);
      }
      .social-telegram:hover svg {
        transform: scale(1.1);
        filter: drop-shadow(0 0 8px var(--telegram-blue));
      }
    }

    .btn-install-pwa {
      display: none;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 12px;
      border-radius: 12px;
      background: transparent;
      border: 1px solid var(--neon-green);
      color: var(--neon-green);
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
    }

    .btn-install-pwa svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    @media (hover: hover) {
      .btn-install-pwa:hover {
        background: transparent;
        color: var(--neon-green);
        border-color: #fff;
        box-shadow: 0 0 18px var(--green-glow), 0 0 8px #fff;
        transform: translateY(-2px);
      }
      .btn-install-pwa:hover svg {
        transform: translateY(2px);
      }
    }

    @media (max-width: 480px) {
      .btn-install-pwa span { display: none; }
      .btn-install-pwa { padding: 0 10px; }
    }

    .workspace {
      flex: 1;
      width: 100%;
      height: calc(var(--app-height) - 52px);
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 900px) {
      .workspace {
        display: grid;
        grid-template-columns: minmax(360px, 460px) 1fr;
        gap: 20px;
        padding: 14px 28px 18px 28px;
        height: calc(100vh - 58px);
        max-width: 1920px;
        margin: 0 auto;
        box-sizing: border-box;
      }
    }

    @media (min-width: 1440px) {
      .workspace {
        grid-template-columns: 460px 1fr;
        gap: 24px;
        padding: 18px 36px 22px 36px;
      }
    }

    .player-deck {
      background: var(--surface-1);
      border-radius: 0;
      padding: 12px 14px 14px 14px;
      padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      width: 100%;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      position: relative;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    @media (min-width: 900px) {
      .player-deck {
        border: 1px solid var(--border-subtle);
        border-radius: 24px;
        padding: 18px 22px 16px 22px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      }
    }

    .player-bg-art {
      position: absolute;
      inset: -15px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(12.6px) brightness(0.82);
      opacity: 0.62;
      z-index: 0;
      pointer-events: none;
      transform: scale(1.06) translateZ(0);
      will-change: opacity, background-image;
      transition: opacity 0.5s ease;
    }

    .deck-top, .deck-bottom {
      position: relative;
      z-index: 2;
    }

    .deck-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      min-height: 0;
      flex: 1;
      justify-content: center;
    }

    .cover-wrapper {
      width: 100%;
      max-width: min(84vw, 290px);
      aspect-ratio: 1 / 1;
      height: auto;
      max-height: min(290px, 34vh);
      border-radius: 20px;
      margin-bottom: 12px;
      position: relative;
      background: rgba(13, 15, 23, 0.95);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.16);
      flex-shrink: 1;
    }

    @media (min-width: 900px) {
      .cover-wrapper {
        max-width: min(400px, 40vh);
        max-height: min(400px, 40vh);
        border-radius: 24px;
        margin-bottom: 14px;
      }
    }

    .cover-img {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      border-radius: inherit;
      object-fit: contain;
      object-position: center;
      transform: scale(1);
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .is-playing .cover-wrapper {
      border-color: var(--neon-purple);
      box-shadow: 0 14px 34px var(--purple-glow), 0 0 20px rgba(0, 255, 102, 0.2);
    }

    .is-playing .cover-img {
      transform: scale(1.03);
    }

    .title-marquee-container {
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      position: relative;
      text-align: center;
      margin-bottom: 2px;
      mask-image: linear-gradient(90deg, transparent 0%, #000 6%, #000 94%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 6%, #000 94%, transparent 100%);
    }

    #display_title {
      font-size: 18px;
      font-weight: 800;
      white-space: nowrap;
      display: inline-block;
      padding: 0 10px;
      color: var(--text-primary);
      text-align: center;
      will-change: transform;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    }

    @media (min-width: 900px) {
      #display_title { font-size: 21px; }
    }

    .marquee-active {
      animation: pingPongBounce var(--marquee-duration, 10s) ease-in-out infinite alternate !important;
    }

    @keyframes pingPongBounce {
      0%, 15% { transform: translateX(0); }
      85%, 100% { transform: translateX(var(--scroll-distance, -50px)); }
    }

    .meta-artist {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      text-align: center;
      margin-bottom: 6px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    }

    .meta-dj-row {
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.35);
      padding: 3px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
    }

    .emit-label {
      color: var(--neon-purple);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px var(--purple-glow);
    }

    #display_dj {
      display: inline-block;
      color: var(--neon-green);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px var(--green-glow);
    }

    @media (min-width: 900px) {
      .emit-label, #display_dj { font-size: 17px; }
    }

    .dj-country-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #e2e6f0;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
      min-height: 18px;
    }

    .dj-flag-img {
      width: 18px;
      height: 12px;
      border-radius: 2px;
      object-fit: cover;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
      display: inline-block;
    }

    .deck-bottom {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
      flex-shrink: 0;
    }

    .equalizer-canvas-container {
      width: 100%;
      height: 38px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      contain: strict;
    }

    @media (min-width: 900px) {
      .equalizer-canvas-container { height: 48px; }
    }

    #equalizerCanvas {
      width: 100%;
      height: 100%;
      display: block;
      transform: translateZ(0);
    }

    .playback-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 4px 0;
    }

    .btn-play-hero {
      background: #b026ff !important;
      border: none;
      color: white;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(176, 38, 255, 0.6) !important;
      transition: transform 0.2s, box-shadow 0.2s;
      flex-shrink: 0;
    }

    .btn-play-hero:active {
      transform: scale(0.94);
    }

    .btn-deck-action {
      background: rgba(0, 255, 102, 0.14);
      border: 1px solid rgba(0, 255, 102, 0.45);
      color: var(--neon-green);
      padding: 0 14px;
      height: 42px;
      border-radius: 21px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s, color 0.2s, box-shadow 0.2s;
      flex-shrink: 0;
      backdrop-filter: blur(8px);
      outline: none;
    }

    @media (hover: hover) {
      .btn-deck-action:hover {
        background: rgba(0, 255, 102, 0.25);
        color: #fff;
      }
    }

    .btn-deck-action:active,
    .btn-deck-action.active {
      background: var(--neon-green) !important;
      color: #08090d !important;
      box-shadow: 0 0 14px var(--green-glow);
    }

    .btn-deck-staff {
      display: flex;
    }

    @media (min-width: 900px) {
      .btn-deck-staff {
        display: none !important;
      }
    }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 12px;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      min-height: 34px;
      backdrop-filter: blur(8px);
    }

    .vol-icon {
      width: 16px;
      height: 16px;
      fill: var(--text-secondary);
      cursor: pointer;
      flex-shrink: 0;
    }

    .vol-icon:hover {
      fill: var(--text-primary);
    }

    .volume-slider {
      flex: 1;
      height: 5px;
      -webkit-appearance: none;
      appearance: none;
      background: linear-gradient(to right, #b026ff 100%, rgba(255, 255, 255, 0.15) 100%);
      border-radius: 6px;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 8px #b026ff;
    }

    .library-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100%;
      height: var(--app-height);
      background: rgba(10, 12, 17, 0.98);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      z-index: 100;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 14px calc(12px + env(safe-area-inset-bottom, 0px)) 14px;
      display: flex;
      flex-direction: column;
      transform: translateY(105%);
      transition: transform 0.32s cubic-bezier(0.2, 0.9, 0.2, 1);
      visibility: hidden;
    }

    .library-panel.drawer-open {
      transform: translateY(0%);
      visibility: visible;
    }

    @media (min-width: 900px) {
      .library-panel {
        position: static;
        width: 100%;
        height: 100%;
        background: var(--surface-1);
        border: 1px solid var(--border-subtle);
        border-radius: 24px;
        padding: 16px 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        transform: none !important;
        visibility: visible !important;
        z-index: 1;
        overflow: hidden;
      }
    }

    .drawer-mobile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    @media (min-width: 900px) {
      .drawer-mobile-header {
        display: none;
      }
    }

    .drawer-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--neon-green);
    }

    .btn-close-drawer {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      color: #ffffff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
    }

    .panel-header {
      display: flex;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .tabs-group {
      display: flex;
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 3px;
      gap: 4px;
      width: 100%;
      max-width: 300px;
    }

    .tab-item {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 8px 14px;
      font-family: inherit;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.5px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    #tabChat { display: none; }

    .tab-item.active {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }

    .tab-view-container {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      background: #1e1e1e;
    }

    .view-content {
      width: 100%;
      height: 100%;
      display: none;
    }

    .view-content.active {
      display: block;
    }

    .chat-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #1e1e1e;
    }

    /* ----------------------------------------------------
       ESTILOS STAFF: FOTOS CUADRADAS Y RANGOS VERDES
       ---------------------------------------------------- */
    .staff-container {
      width: 100%;
      height: 100%;
      background: var(--surface-1);
      padding: 14px;
      overflow-y: auto;
      box-sizing: border-box;
    }

    .staff-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      list-style: none;
    }

    @media (min-width: 900px) {
      .staff-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 14px;
      }
    }

    .staff-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.03);

      position: relative;
      overflow: hidden;
      min-height: 195px;
    }

    @media (min-width: 900px) {
      .staff-card {
        min-height: 230px;
        padding: 16px 8px 38px 8px;
      }
    }

    .staff-card:hover {
      transform: translateY(-3px);

      background: rgba(176, 38, 255, 0.08);
      box-shadow: 0 8px 22px rgba(176, 38, 255, 0.35);

    .staff-avatar-img {
      width: 92px;
      height: 92px;
      border-radius: 14px;
      object-fit: cover;

      box-shadow: 0 0 14px rgba(176, 38, 255, 0.35);

      font-weight: 800;

      inset: 0;
      background: rgba(0, 0, 0, 0.82);

  <script>
    // ----------------------------------------------------
    // SERVICE WORKER CON AUTO-REINICIO AL ACTUALIZAR
    // ----------------------------------------------------
    if ('serviceWorker' in navigator) {
      let refreshing = false;

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          reg.update();
        }).catch(() => {});
      });
    }

    let deferredPrompt = null;
    const btnInstallPwa = document.getElementById("btnInstallPwa");

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btnInstallPwa.style.display = "inline-flex";
    });

    btnInstallPwa.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        btnInstallPwa.style.display = 'none';
      }
      deferredPrompt = null;
    });

    window.addEventListener('appinstalled', () => {
      btnInstallPwa.style.display = 'none';
      deferredPrompt = null;
    });

    if (window.matchMedia('(display-mode: standalone)').matches) {
      btnInstallPwa.style.display = 'none';
    }

    const STREAM_URL = "https://mars.streamerr.co/8434/stream";
    const STATS_URL = "https://mars.streamerr.co/8434/stats?json=1";
    const DEFAULT_COVER = "djs/nexusdj.webp";

    const audio = document.getElementById("audioSource");
    const playerDeck = document.getElementById("playerDeck");
    const playerBgArt = document.getElementById("playerBgArt");
    const libraryPanel = document.getElementById("libraryPanel");
    const btnPlay = document.getElementById("btnPlay");
    const playIcon = document.getElementById("playIcon");
    const btnDeckChat = document.getElementById("btnDeckChat");
    const btnDeckStaff = document.getElementById("btnDeckStaff");
    const btnCloseDrawer = document.getElementById("btnCloseDrawer");
    const sonicTitle = document.getElementById("sonic_title");
    const displayTitle = document.getElementById("display_title");
    const marqueeContainer = document.getElementById("marqueeContainer");
    const sonicDj = document.getElementById("sonic_dj");
    const displayDj = document.getElementById("display_dj");
    const trackArtist = document.getElementById("trackArtist");
    const coverImg = document.getElementById("coverImg");
    const djCountryRow = document.getElementById("djCountryRow");
    const djCountryName = document.getElementById("djCountryName");
    const djFlagImg = document.getElementById("djFlagImg");
    const volumeControl = document.getElementById("volumeControl");
    const volMuteBtn = document.getElementById("volMuteBtn");
    const volMaxBtn = document.getElementById("volMaxBtn");
    const linkTiktok = document.getElementById("linkTiktok");
    const linkTelegram = document.getElementById("linkTelegram");

    const tabChat = document.getElementById("tabChat");
    const tabStaff = document.getElementById("tabStaff");
    const viewChat = document.getElementById("viewChat");
    const viewStaff = document.getElementById("viewStaff");

    // Modal elements
    const staffListGrid = document.getElementById("staffListGrid");
    const djModalOverlay = document.getElementById("djModalOverlay");
    const btnCloseModal = document.getElementById("btnCloseModal");
    const modalDjImg = document.getElementById("modalDjImg");
    const modalDjName = document.getElementById("modalDjName");
    const modalDjRole = document.getElementById("modalDjRole");
    const modalDjFlag = document.getElementById("modalDjFlag");
    const modalDjCountryName = document.getElementById("modalDjCountryName");
    const modalDjDesc = document.getElementById("modalDjDesc");
    const modalDjSchedule = document.getElementById("modalDjSchedule");

    let isPlaying = false;
    let lastObservedTitle = "";
    let lastObservedDjRaw = "";
    let currentCoverUrl = "";
    let djMap = {};
    const coverMemoryCache = new Map();

    // ----------------------------------------------------
    // CARGAR STAFF DESDE staff.js GLOBAL
    // ----------------------------------------------------
    function loadStaffMembers() {
      try {
        if (window.STAFF_MEMBERS && Array.isArray(window.STAFF_MEMBERS)) {
          renderStaffGrid(window.STAFF_MEMBERS);
        } else {
          console.warn("window.STAFF_MEMBERS no está disponible.");
        }
      } catch (err) {
        console.warn("Error al renderizar el staff:", err);
      }
    }

    function renderStaffGrid(members) {
      staffListGrid.innerHTML = "";
      members.forEach((dj) => {
        const li = document.createElement("li");
        li.className = "staff-card";

        const flagUrl = dj.flag ? `https://flagcdn.com/24x18/${dj.flag.toLowerCase()}.png` : "";
        const imgSrc = dj.image ? `${dj.image}` : "djs/nexusdj.webp";

        li.innerHTML = `
          <img src="${imgSrc}" class="staff-avatar-img" alt="${dj.name}" onerror="this.onerror=null; this.src='djs/nexusdj.webp';">
          <div class="staff-info">
            <div class="staff-name">${dj.name}</div>
          </div>
          <div class="staff-country-badge">
            ${flagUrl ? `<img src="${flagUrl}" alt="${dj.country}">` : ""}
            <span>${dj.country || "Int."}</span>
          </div>
          <span class="staff-badge">${dj.badge || "Staff"}</span>
        `;

        li.addEventListener("click", () => openDjModal(dj));
        staffListGrid.appendChild(li);
      });
    }

    function openDjModal(dj) {
      const imgSrc = dj.image ? `${dj.image}` : "djs/nexusdj.webp";
      modalDjImg.src = imgSrc;
      modalDjImg.onerror = () => { 
        modalDjImg.onerror = null; 
        modalDjImg.src = "djs/nexusdj.webp"; 
      };
      
      modalDjName.textContent = dj.name;
      modalDjRole.textContent = dj.role || dj.badge || "Miembro del Staff";
      
      if (dj.country) {
        modalDjCountryName.textContent = dj.country;
        if (dj.flag) {
          modalDjFlag.src = `https://flagcdn.com/24x18/${dj.flag.toLowerCase()}.png`;
          modalDjFlag.style.display = "inline-block";
        } else {
          modalDjFlag.style.display = "none";
        }
        document.getElementById("modalDjCountry").style.display = "flex";
      } else {
        document.getElementById("modalDjCountry").style.display = "none";
      }

      modalDjDesc.textContent = dj.description || "No hay información adicional disponible.";
      modalDjSchedule.textContent = dj.schedule || "Sin horarios fijos especificados.";

      djModalOverlay.classList.add("modal-active");
    }

    function closeDjModal() {
      djModalOverlay.classList.remove("modal-active");
    }

    btnCloseModal.addEventListener("click", closeDjModal);
    djModalOverlay.addEventListener("click", (e) => {
      if (e.target === djModalOverlay) closeDjModal();
    });

    loadStaffMembers();

    // ----------------------------------------------------
    // VISTAS INDEPENDIENTES (PC Y MÓVIL)
    // ----------------------------------------------------
    function activateTab(tabName) {
      if (tabName === "chat") {
        tabChat.style.display = "flex";
        tabChat.classList.add("active");
        tabStaff.classList.remove("active");
        viewChat.classList.add("active");
        viewStaff.classList.remove("active");
        btnDeckChat.classList.add("active");
      } else {
        tabChat.style.display = "none";
        tabChat.classList.remove("active");
        tabStaff.classList.add("active");
        viewStaff.classList.add("active");
        viewChat.classList.remove("active");
        btnDeckChat.classList.remove("active");
        btnDeckChat.blur();
      }
    }

    btnDeckChat.addEventListener("click", () => {
      const isMobile = window.innerWidth < 900;
      if (isMobile) {
        if (libraryPanel.classList.contains("drawer-open") && viewChat.classList.contains("active")) {
          libraryPanel.classList.remove("drawer-open");
          btnDeckChat.classList.remove("active");
          btnDeckChat.blur();
        } else {
          activateTab("chat");
          libraryPanel.classList.add("drawer-open");
        }
      } else {
        if (viewChat.classList.contains("active")) {
          activateTab("staff");
        } else {
          activateTab("chat");
        }
      }
    });

    btnDeckStaff.addEventListener("click", () => {
      btnDeckChat.classList.remove("active");
      btnDeckChat.blur();
      if (libraryPanel.classList.contains("drawer-open") && viewStaff.classList.contains("active")) {
        libraryPanel.classList.remove("drawer-open");
      } else {
        activateTab("staff");
        libraryPanel.classList.add("drawer-open");
      }
    });

    btnCloseDrawer.addEventListener("click", () => {
      libraryPanel.classList.remove("drawer-open");
      btnDeckChat.classList.remove("active");
      btnDeckChat.blur();
      activateTab("staff");
    });

    tabChat.addEventListener("click", () => activateTab("chat"));
    tabStaff.addEventListener("click", () => activateTab("staff"));

    async function loadDjMap() {
      try {
        const res = await fetch("djs.json?nocache=" + Date.now());
        if (res.ok) {
          djMap = await res.json();
          if (djMap.social) {
            if (djMap.social.tiktok) linkTiktok.href = djMap.social.tiktok;
            if (djMap.social.telegram) linkTelegram.href = djMap.social.telegram;
          }
        }
      } catch (_) {
        djMap = {
          "no dj": { display: "NeXusDj", image: "djs/nexusdj.webp", country: "España", flag: "es" },
          "yahirmaniaca": { display: "YaHiRMaNiaCa", image: "djs/yahirmaniaca.webp", country: "México", flag: "mx" },
          "|lu5|0n": { display: "|lu5|0n", image: "djs/lu50n.webp", country: "Argentina", flag: "ar" },
          "castle": { display: "Castle", image: "djs/castle.webp", country: "España", flag: "es" }
        };
      }
      processDjUpdate(sonicDj.textContent.trim());
    }
    loadDjMap();

    function processDjUpdate(rawDj) {
      if (!rawDj) rawDj = "no dj";
      let cleanDj = rawDj.replace(/\s+/g, ' ').trim();
      let lookupKey = cleanDj.toLowerCase();

      if (lookupKey === "" || lookupKey === "nodj" || lookupKey.includes("no dj")) {
        lookupKey = "no dj";
      }

      lastObservedDjRaw = lookupKey;

      let styledName = cleanDj;
      let imgPath = `djs/${encodeURIComponent(lookupKey)}.webp`;
      let country = "España";
      let flagCode = "es";

      if (djMap[lookupKey]) {
        styledName = djMap[lookupKey].display || styledName;
        imgPath = djMap[lookupKey].image || imgPath;
        country = djMap[lookupKey].country || "";
        flagCode = djMap[lookupKey].flag || "";
      } else if (lookupKey === "no dj") {
        styledName = "NeXusDj";
        imgPath = "djs/nexusdj.webp";
        country = "España";
        flagCode = "es";
      }

      displayDj.textContent = styledName;

      if (country) {
        djCountryName.textContent = country;
        if (flagCode) {
          djFlagImg.src = `https://flagcdn.com/24x18/${flagCode.toLowerCase()}.png`;
          djFlagImg.style.display = "inline-block";
        } else {
          djFlagImg.style.display = "none";
        }
        djCountryRow.style.display = "flex";
      } else {
        djCountryRow.style.display = "none";
      }

      coverImg.onerror = () => {
        coverImg.onerror = null;
        coverImg.src = DEFAULT_COVER;
      };
      coverImg.src = imgPath;
    }

    const djObserver = new MutationObserver(() => {
      processDjUpdate(sonicDj.textContent.trim());
    });
    djObserver.observe(sonicDj, { childList: true, subtree: true, characterData: true });

    function applyBackgroundCover(url) {
      if (!url) return;
      let cleanUrl = url.split('?')[0].trim();
      if (!cleanUrl || cleanUrl === currentCoverUrl) return;

      currentCoverUrl = cleanUrl;
      const tempImg = new Image();
      tempImg.onload = () => {
        playerBgArt.style.backgroundImage = `url('${cleanUrl}')`;
      };
      tempImg.src = cleanUrl;
    }

    function sanitizeTerm(str) {
      return str
        .replace(/\b(feat|ft|remix|mix|edit|version|radio edit|original mix|extended|official video|audio|lyrics)\b.*$/gi, '')
        .replace(/[\(\[\{].*?[\)\]\}]/g, '')
        .replace(/["'_]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    async function fetchAccurateCover(title, artist) {
      const cacheKey = `${artist} - ${title}`.toLowerCase();
      if (coverMemoryCache.has(cacheKey)) {
        applyBackgroundCover(coverMemoryCache.get(cacheKey));
        return;
      }

      const cleanArtist = sanitizeTerm(artist);
      const cleanTitle = sanitizeTerm(title);

      try {
        const query1 = encodeURIComponent(`${cleanArtist} ${cleanTitle}`);
        let res = await fetch(`https://itunes.apple.com/search?term=${query1}&media=music&entity=song&limit=4`);
        let data = await res.json();

        let bestMatch = null;

        if (data.results && data.results.length > 0) {
          bestMatch = data.results.find(item => {
            const itemArtist = (item.artistName || "").toLowerCase();
            const itemTrack = (item.trackName || "").toLowerCase();
            return (
              itemArtist.includes(cleanArtist.toLowerCase()) ||
              itemTrack.includes(cleanTitle.toLowerCase())
            );
          }) || data.results[0];
        }

        if (!bestMatch && cleanTitle.length > 2) {
          const query2 = encodeURIComponent(cleanTitle);
          res = await fetch(`https://itunes.apple.com/search?term=${query2}&media=music&entity=song&limit=3`);
          data = await res.json();
          if (data.results && data.results.length > 0) {
            bestMatch = data.results[0];
          }
        }

        if (bestMatch && bestMatch.artworkUrl100) {
          const hires = bestMatch.artworkUrl100.replace('100x100bb', '600x600bb');
          coverMemoryCache.set(cacheKey, hires);
          applyBackgroundCover(hires);
        }
      } catch (_) {}
    }

    async function syncMetadataAPI() {
      try {
        const res = await fetch(STATS_URL + "&t=" + Date.now());
        if (res.ok) {
          const data = await res.json();
          if (data.songtitle) {
            updateSongDisplay(data.songtitle);
          }
          if (data.djusername) {
            processDjUpdate(data.djusername);
          }
        }
      } catch (_) {}
    }

    const titleObserver = new MutationObserver(() => {
      const raw = sonicTitle.textContent.trim();
      if (raw) {
        updateSongDisplay(raw);
      }
    });
    titleObserver.observe(sonicTitle, { childList: true, subtree: true, characterData: true });

    setInterval(syncMetadataAPI, 6000);
    syncMetadataAPI();

    // ----------------------------------------------------
    // ECUALIZADOR FFT REAL 28 BANDAS
    // ----------------------------------------------------
    const canvas = document.getElementById("equalizerCanvas");
    const ctx = canvas ? canvas.getContext("2d", { alpha: true }) : null;
    let audioCtx = null;
    let analyser = null;
    let dataArray = null;
    let mediaNode = null;
    let eqAnimId = null;

    const NUM_BARS = 28;
    const peaks = new Float32Array(NUM_BARS);
    const precomputedBins = new Uint16Array(NUM_BARS);
    const precomputedBoosts = new Float32Array(NUM_BARS);
    let cachedBarGradient = null;
    let eqLogicalWidth = 0;
    let eqLogicalHeight = 0;

    function buildPrecomputedLookup() {
      const minIndex = 1;
      const binCount = analyser ? analyser.frequencyBinCount : 128;
      const maxIndex = Math.max(2, Math.floor(binCount * 0.65));

      for (let i = 0; i < NUM_BARS; i++) {
        const fraction = i / (NUM_BARS - 1);
        precomputedBins[i] = Math.min(
          maxIndex,
          Math.floor(minIndex * Math.pow(maxIndex / minIndex, fraction))
        );
        precomputedBoosts[i] = 1 + Math.pow(fraction, 1.7) * 0.92;
      }
    }

    function resizeCanvas() {
      if (!canvas || !canvas.parentElement || !ctx) return;
      const rect = canvas.parentElement.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;

      eqLogicalWidth = rect.width;
      eqLogicalHeight = rect.height;

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(eqLogicalWidth * dpr);
      canvas.height = Math.round(eqLogicalHeight * dpr);

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);

      cachedBarGradient = ctx.createLinearGradient(0, eqLogicalHeight, 0, 0);
      cachedBarGradient.addColorStop(0, "#b026ff");
      cachedBarGradient.addColorStop(0.65, "#b026ff");
      cachedBarGradient.addColorStop(1, "#00ff66");

      buildPrecomputedLookup();

      if (!isPlaying) {
        renderIdleBars();
      }
    }

    function setupWebAudioPipeline() {
      if (audioCtx) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return;
      }
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        analyser.minDecibels = -85;
        analyser.maxDecibels = -10;
        analyser.smoothingTimeConstant = 0.62;

        mediaNode = audioCtx.createMediaElementSource(audio);
        mediaNode.connect(analyser);
        analyser.connect(audioCtx.destination);

        dataArray = new Uint8Array(analyser.frequencyBinCount);
        buildPrecomputedLookup();
      } catch (err) {
        console.warn("AudioContext init handled:", err);
      }
    }

    function renderIdleBars() {
      if (!ctx || eqLogicalWidth <= 0 || eqLogicalHeight <= 0) return;
      ctx.clearRect(0, 0, eqLogicalWidth, eqLogicalHeight);
      const barSpacing = Math.max(2, Math.floor(eqLogicalWidth / 130));
      const barWidth = Math.max(2, Math.floor((eqLogicalWidth - (NUM_BARS - 1) * barSpacing) / NUM_BARS));
      const baselineY = eqLogicalHeight - 3;

      ctx.fillStyle = "rgba(255, 255, 255, 0.12)";
      for (let i = 0; i < NUM_BARS; i++) {
        const x = i * (barWidth + barSpacing);
        ctx.fillRect(x, baselineY, barWidth, 3);
        peaks[i] = 0;
      }
    }

    function drawEqualizer() {
      if (!isPlaying || !analyser || !ctx || eqLogicalWidth <= 0) {
        renderIdleBars();
        return;
      }

      eqAnimId = requestAnimationFrame(drawEqualizer);
      ctx.clearRect(0, 0, eqLogicalWidth, eqLogicalHeight);

      analyser.getByteFrequencyData(dataArray);

      const barSpacing = Math.max(2, Math.floor(eqLogicalWidth / 130));
      const barWidth = Math.max(2, Math.floor((eqLogicalWidth - (NUM_BARS - 1) * barSpacing) / NUM_BARS));
      const H = eqLogicalHeight;

      ctx.fillStyle = cachedBarGradient || "#b026ff";

      for (let i = 0; i < NUM_BARS; i++) {
        const val = dataArray[precomputedBins[i]] || 0;
        const norm = Math.min(1, (val / 255) * precomputedBoosts[i]);
        let barHeight = Math.pow(norm, 1.25) * H * 1.35;

        if (barHeight < 3) barHeight = 3;
        else if (barHeight > H) barHeight = H;

        const x = i * (barWidth + barSpacing);
        const y = H - barHeight;

        ctx.fillRect(x, y, barWidth, barHeight);

        if (barHeight >= peaks[i]) {
          peaks[i] = barHeight;
        } else {
          peaks[i] = Math.max(0, peaks[i] - 1.9);
        }
      }

      ctx.fillStyle = "#ffffff";
      for (let i = 0; i < NUM_BARS; i++) {
        if (peaks[i] > 5) {
          const x = i * (barWidth + barSpacing);
          const peakY = H - peaks[i];
          ctx.fillRect(x, peakY - 3, barWidth, 2);
        }
      }
    }

    function startEqualizer() {
      if (!eqAnimId) eqAnimId = requestAnimationFrame(drawEqualizer);
    }

    function stopEqualizer() {
      if (eqAnimId) {
        cancelAnimationFrame(eqAnimId);
        eqAnimId = null;
      }
      renderIdleBars();
    }

    window.addEventListener("resize", resizeCanvas, { passive: true });
    window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 150), { passive: true });
    resizeCanvas();

    // ----------------------------------------------------
    // REPRODUCCIÓN OPTIMIZADA (FLUIDA Y SIN CORTES)
    // ----------------------------------------------------
    btnPlay.addEventListener("click", () => {
      if (!isPlaying) {
        audio.src = STREAM_URL + "?nocache=" + Date.now();
        audio.load();
        
        setTimeout(() => {
          audio.play().catch(err => {
            console.warn("Autoplay en espera:", err);
          });
        }, 100);
      } else {
        audio.pause();
        audio.src = "";
        audio.removeAttribute("src");
        audio.load();
        setPlayingState(false);
      }
    });

    audio.addEventListener("playing", () => {
      setTimeout(() => {
        setupWebAudioPipeline();
      }, 150);
      setPlayingState(true);
    });

    audio.addEventListener("pause", () => {
      setPlayingState(false);
    });

    audio.addEventListener("stalled", () => {
      if (isPlaying) {
        console.warn("Stream trabado, reconectando...");
        audio.src = STREAM_URL + "?nocache=" + Date.now();
        audio.play().catch(() => {});
      }
    });

    function setPlayingState(playing) {
      isPlaying = playing;
      if (playing) {
        playerDeck.classList.add("is-playing");
        playIcon.innerHTML = `<rect x="6" y="6" width="12" height="12" rx="1.5" />`;
        startEqualizer();
      } else {
        playerDeck.classList.remove("is-playing");
        playIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
        stopEqualizer();
      }
    }

    function updateVolumeVisual(val) {
      audio.volume = val;
      const pct = Math.round(val * 100);
      volumeControl.style.background = `linear-gradient(to right, #b026ff ${pct}%, rgba(255, 255, 255, 0.15) ${pct}%)`;
    }

    volumeControl.addEventListener("input", (e) => {
      updateVolumeVisual(parseFloat(e.target.value));
    });

    volMuteBtn.addEventListener("click", () => {
      volumeControl.value = 0;
      updateVolumeVisual(0);
    });

    volMaxBtn.addEventListener("click", () => {
      volumeControl.value = 1;
      updateVolumeVisual(1);
    });

    function recalculateMarquee() {
      displayTitle.classList.remove("marquee-active");
      displayTitle.style.transform = "translateX(0)";

      requestAnimationFrame(() => {
        const containerW = marqueeContainer.clientWidth;
        const textW = displayTitle.scrollWidth;

        if (textW > containerW - 10) {
          const distance = -(textW - containerW + 24);
          const duration = Math.max(6, Math.abs(distance) / 20);
          displayTitle.style.setProperty("--scroll-distance", `${distance}px`);
          displayTitle.style.setProperty("--marquee-duration", `${duration}s`);
          displayTitle.classList.add("marquee-active");
        }
      });
    }

    window.addEventListener("resize", recalculateMarquee, { passive: true });

    function updateSongDisplay(rawString) {
      if (!rawString) return;
      const raw = rawString.trim();
      if (!raw || raw === lastObservedTitle || raw === "Cargando emisión...") return;

      lastObservedTitle = raw;
      let artist = "Nexus Zone Radio";
      let songOnly = raw;

      if (raw.includes(" - ")) {
        const parts = raw.split(" - ");
        artist = parts[0].trim();
        songOnly = parts.slice(1).join(" - ").trim();
      }

      trackArtist.textContent = artist;
      displayTitle.textContent = songOnly;
      recalculateMarquee();
      
      fetchAccurateCover(songOnly, artist);
    }
  </script>
